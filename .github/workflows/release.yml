name: Release

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 or v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string
      publish_crate:
        description: "Publish to crates.io after GitHub Release is created"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    if: >
      github.event_name != 'pull_request' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/v')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ubuntu-stable-publish

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/release/verify-version.sh "${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            release_branch="${{ github.event.pull_request.head.ref }}"
            scripts/release/verify-version.sh "${release_branch#release/}"
          else
            scripts/release/verify-version.sh "${{ inputs.version }}"
          fi

      - name: Import GPG signing key
        if: github.event_name == 'pull_request'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true
          git_config_global: true

      - name: Create signed release tag
        if: github.event_name == 'pull_request'
        run: |
          tag="${{ steps.version.outputs.version }}"
          scripts/release/assert-tag-safe.sh "$tag"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists locally."
          else
            git tag -s "$tag" -m "Release $tag"
            git push origin "refs/tags/${tag}"
          fi

      - name: Verify release tag is GitHub Verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.version }}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          scripts/release/verify-tag-verified.sh "${tag}" "${GITHUB_REPOSITORY}"

      - name: Format check
        run: make fmt-check

      - name: Test
        run: cargo test --all-features --locked

      - name: Examples
        run: make examples

      - name: MCP build
        run: make mcp-build

      - name: MCP stdio smoke
        run: make mcp-stdio-smoke

      - name: MCP remote build
        run: make mcp-remote-build

      - name: MCP remote smoke
        run: make mcp-remote-smoke

      - name: MCPB smoke
        run: make mcpb-smoke VERSION="${{ steps.version.outputs.version }}"

      - name: MCP Registry metadata
        run: make server-json-validate VERSION="${{ steps.version.outputs.version }}"

      - name: Action smoke
        run: make action-smoke

      - name: Dogfood
        run: make dogfood

      - name: Public confidence
        run: make public-confidence

      - name: Clone upstream markdownlint
        run: git clone --depth 1 https://github.com/DavidAnson/markdownlint.git "${RUNNER_TEMP}/markdownlint"

      - name: Upstream drift check
        env:
          KML_UPSTREAM_MARKDOWNLINT_DOC_DIR: ${{ runner.temp }}/markdownlint/doc
        run: make upstream-drift

      - name: Clippy
        run: make lint

      - name: Publish dry-run
        run: cargo publish --dry-run --locked --allow-dirty

      - name: Install smoke test
        run: |
          cargo install --path . --locked --force --root "${RUNNER_TEMP}/kml-install-check" --bin kml
          "${RUNNER_TEMP}/kml-install-check/bin/kml" init-config --config "${RUNNER_TEMP}/kml-install-check/.markdownlint.json"

      - name: Package crate
        id: package
        run: scripts/release/package-crate.sh "${{ steps.version.outputs.version_bare }}"

      - name: Package MCPB
        id: mcpb
        run: |
          make mcp-server-json VERSION="${{ steps.version.outputs.version }}"
          mcpb_path="target/mcpb/katana-markdown-linter-${{ steps.version.outputs.version_bare }}.mcpb"
          mcpb_checksum_path="${mcpb_path}.sha256"
          echo "mcpb_path=${mcpb_path}" >> "$GITHUB_OUTPUT"
          echo "mcpb_checksum_path=${mcpb_checksum_path}" >> "$GITHUB_OUTPUT"
          echo "server_json_path=target/mcpb/server.json" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: scripts/release/release-notes.sh "${{ steps.version.outputs.version_bare }}" > RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          MCPB_PATH: ${{ steps.mcpb.outputs.mcpb_path }}
          MCPB_CHECKSUM_PATH: ${{ steps.mcpb.outputs.mcpb_checksum_path }}
          SERVER_JSON_PATH: ${{ steps.mcpb.outputs.server_json_path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --target "$(git rev-parse HEAD)"
            gh release upload "$TAG" "$PACKAGE_PATH" "$CHECKSUM_PATH" "$MCPB_PATH" "$MCPB_CHECKSUM_PATH" "$SERVER_JSON_PATH" --clobber
          else
            gh release create "$TAG" "$PACKAGE_PATH" "$CHECKSUM_PATH" "$MCPB_PATH" "$MCPB_CHECKSUM_PATH" "$SERVER_JSON_PATH" \
              --verify-tag \
              --target "$(git rev-parse HEAD)" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Publish MCP Registry metadata
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz -f - mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish "${{ steps.mcpb.outputs.server_json_path }}"

      - name: Publish crate
        if: >
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_crate == true)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is required to publish to crates.io." >&2
            exit 1
          fi
          scripts/release/assert-crate-not-published.sh "${{ steps.version.outputs.version_bare }}"
          cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
