name: CI

on:
  push:
    branches: [main, master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'action.yml'
      - '.markdownlint-dogfood.json'
      - '.codex/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches: [main, master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'action.yml'
      - '.markdownlint-dogfood.json'
      - '.codex/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Build
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}-stable-default

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check types
        run: cargo check --workspace --locked

      - name: Check formatting
        if: matrix.os != 'windows-latest'
        run: make fmt-check

      - name: Run Windows format check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      - name: Run linter
        if: matrix.os != 'windows-latest'
        run: make lint

      - name: Run AST linter
        if: matrix.os != 'windows-latest'
        run: make ast-lint

      - name: Run tests
        if: matrix.os != 'windows-latest'
        run: cargo test --workspace --locked

      - name: Run Windows workspace test
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --locked

      - name: Run dogfood
        if: matrix.os != 'windows-latest'
        run: make dogfood

      - name: Run action smoke
        if: matrix.os == 'ubuntu-latest'
        run: make action-smoke

      - name: Run MCP stdio smoke
        if: matrix.os == 'ubuntu-latest'
        run: make mcp-stdio-smoke

      - name: Run coverage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: make coverage
