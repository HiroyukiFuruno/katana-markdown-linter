name: CI

on:
  push:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'just/**'
      - 'action.yml'
      - '.markdownlint-dogfood.json'
      - '.codex/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'wrappers/**'
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'just/**'
      - 'action.yml'
      - '.markdownlint-dogfood.json'
      - '.codex/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
      - 'tests/**'
      - 'wrappers/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Build
    # WHY: Avoid redundant CI runs when a PR is merged — tests already passed on the PR branch.
    # Direct pushes to master (admin) still trigger the full 3-platform matrix.
    if: >-
      github.event_name != 'push' || (
        !startsWith(github.event.head_commit.message, 'Merge pull request ') &&
        !contains(github.event.head_commit.message, '(#')
      )
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}-stable-default

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Check types
        run: cargo check --workspace --locked

      - name: Check formatting
        if: matrix.os != 'windows-latest'
        run: just fmt-check

      - name: Run Windows format check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      - name: Run linter
        if: matrix.os != 'windows-latest'
        run: just lint

      - name: Run AST linter
        if: matrix.os != 'windows-latest'
        run: just ast-lint

      - name: Run tests
        if: matrix.os != 'windows-latest'
        run: cargo test --workspace --locked

      - name: Run Windows workspace test
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --locked

      - name: Run dogfood
        if: matrix.os != 'windows-latest'
        run: just dogfood

      - name: Run public confidence
        if: matrix.os != 'windows-latest'
        run: just public-confidence

      - name: Run action smoke
        if: matrix.os == 'ubuntu-latest'
        run: just action-smoke

      - name: Run MCP stdio smoke
        if: matrix.os == 'ubuntu-latest'
        run: just mcp-stdio-smoke

      - name: Run MCP remote smoke
        if: matrix.os == 'ubuntu-latest'
        run: just mcp-remote-smoke

      - name: Run coverage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: just coverage
