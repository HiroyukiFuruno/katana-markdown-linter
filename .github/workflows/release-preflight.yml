name: release-preflight

on:
  pull_request:
    branches: [main, master]
    paths:
      - '**.rs'
      - 'README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/**'
      - 'docs/**'
      - 'mcpb/**'
      - 'openspec/**'
      - 'scripts/**'
      - 'server.json'
      - 'tests/**'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Format check
        run: make fmt-check

      - name: Test
        run: cargo test --all-features --locked

      - name: Examples
        run: make examples

      - name: MCP build
        run: make mcp-build

      - name: MCP stdio smoke
        run: make mcp-stdio-smoke

      - name: MCP remote build
        run: make mcp-remote-build

      - name: MCP remote smoke
        run: make mcp-remote-smoke

      - name: MCPB smoke
        run: make mcpb-smoke

      - name: MCP Registry metadata
        run: make server-json-validate

      - name: Action smoke
        run: make action-smoke

      - name: Dogfood
        run: make dogfood

      - name: Public confidence
        run: make public-confidence

      - name: Document answer fix
        run: make document-answer-fix

      - name: Clone upstream markdownlint
        run: git clone --depth 1 https://github.com/DavidAnson/markdownlint.git "${RUNNER_TEMP}/markdownlint"

      - name: Upstream drift check
        env:
          KML_UPSTREAM_MARKDOWNLINT_DOC_DIR: ${{ runner.temp }}/markdownlint/doc
        run: make upstream-drift

      - name: Clippy
        run: make lint

      - name: Package
        run: cargo package --locked --allow-dirty

      - name: Dry-run publish
        run: cargo publish --dry-run --locked --allow-dirty

      - name: Install binary
        run: |
          cargo install --path . --locked --force --root "${RUNNER_TEMP}/kml-install-check" --bin kml
          "${RUNNER_TEMP}/kml-install-check/bin/kml" init-config --config "${RUNNER_TEMP}/kml-install-check/.markdownlint.json"
