[package]
name = "katana-markdown-linter"
version = "0.15.0"
edition = "2021"
authors = ["Katana Team"]
description = "A high-performance Markdown linter with MCP support"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "auth"] }
axum = { version = "0.7", optional = true }
rmcp = { version = "0.4", features = ["streamable-http"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.9"
glob = "0.3"
walkdir = "2.4"
regex = "1.10"
itertools = "0.12"
colored = "2.1"
md-rel = "0.1"
schemars = "0.8"

[features]
default = []
remote = ["dep:axum"]

[[bin]]
name = "kml"
path = "src/bin/kml.rs"

[[bin]]
name = "kml-mcp"
path = "src/bin/kml_mcp/main.rs"

[[bin]]
name = "kml-mcp-remote"
path = "src/bin/kml-mcp-remote.rs"
required-features = ["remote"]

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"
