[package]
name = "katana-markdown-linter"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "markdownlint-compatible Markdown linter library"
repository = "https://github.com/HiroyukiFuruno/katana-markdown-linter"
readme = "README.md"
keywords = ["markdown", "lint", "markdownlint", "kml"]
categories = ["development-tools", "command-line-utilities", "text-processing"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "Markfile",
    "build.rs",
    "docs/**",
    "examples/**",
    "upstream_docs/**",
    "src/**",
    "tests/**",
]

[lib]
name = "katana_markdown_linter"
path = "src/lib.rs"

[[bin]]
name = "kml"
path = "src/main.rs"

[[bin]]
name = "kml-mcp"
path = "src/bin/kml-mcp.rs"
required-features = ["mcp"]

[features]
default = []
cli = []
jsonc = []
mcp = ["dep:rmcp", "dep:tokio"]

[dependencies]
glob = "0.3"
ignore = "0.4"
regex = "1"
rmcp = { version = "1.5.0", optional = true, default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread"] }
