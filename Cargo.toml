[package]
name = "katana-markdown-linter"
version = "0.19.0"

edition = "2021"
license = "MIT"
description = "markdownlint-compatible Markdown linter library"
repository = "https://github.com/HiroyukiFuruno/katana-markdown-linter"
readme = "README.md"
keywords = ["markdown", "lint", "markdownlint", "kml"]
categories = ["development-tools", "command-line-utilities", "text-processing"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "Markfile",
    "build.rs",
    "server.json",
    "docs/**",
    "examples/**",
    "mcpb/**",
    "schema/**",
    "upstream_docs/**",
    "src/**",
    "tests/**",
]

[lib]
name = "katana_markdown_linter"
path = "src/lib.rs"

[[bin]]
name = "kml"
path = "src/main.rs"

[[bin]]
name = "kml-mcp"
path = "src/bin/kml-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "kml-mcp-remote"
path = "src/bin/kml-mcp-remote.rs"
required-features = ["mcp-remote"]

[features]
default = []
cli = []
jsonc = []
mcp = ["dep:rmcp", "dep:tokio"]
mcp-remote = [
    "mcp",
    "dep:axum",
    "dep:tracing-subscriber",
    "rmcp/transport-streamable-http-server",
    "tokio/net",
    "tokio/time",
]

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio"] }
glob = "0.3"
ignore = "0.4"
regex = "1"
rmcp = { version = "1.6.0", optional = true, default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
unicode-width = "0.2"

[dev-dependencies]
katana-ast-lint = "0.5.1"
