[package]
name = "katana-markdown-linter"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "markdownlint-compatible Markdown linter library"
repository = "https://github.com/HiroyukiFuruno/katana-markdown-linter"
readme = "README.md"
keywords = ["markdown", "lint", "markdownlint", "kml"]
categories = ["development-tools", "command-line-utilities", "text-processing"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "Markfile",
    "build.rs",
    "docs/**",
    "examples/**",
    "upstream_docs/**",
    "src/**",
    "tests/**",
]

[lib]
name = "katana_markdown_linter"
path = "src/lib.rs"

[[bin]]
name = "kml"
path = "src/main.rs"

[features]
default = []
cli = []
jsonc = []

[dependencies]
glob = "0.3"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
